name: campus_mobile
description: "Campulse - 校园代码共享与项目交流"
# 私有包，禁止误发布 / private package, never published to pub.dev
publish_to: 'none'

version: 1.6.2+11

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # 国际化（§0.8 中英双语）/ i18n: Chinese + English
  flutter_localizations:
    sdk: flutter

  # 与后端 REST 接口通信 / talks to the backend REST API
  http: ^1.2.2
  # 生成 MaterialLocalizations / supplies MaterialLocalizations
  intl: any
  # 本地偏好持久化（语言、主题）/ local preference persistence
  shared_preferences: ^2.3.2
  # §7 Launcher 的 Phase 0 路径：把 Web / Deep Link 交给系统打开。
  # §7's Phase 0 launcher path: hand web and deep links to the system.
  url_launcher: ^6.3.1
  # §7：web 目标优先内置 WebView，失败再回退系统浏览器。
  # §7: web targets prefer the in-app WebView, falling back to the system browser.
  webview_flutter: ^4.14.1
  # 高校校徽是矢量 SVG，Flutter 无法原生渲染，因此用成熟的纯 Dart 渲染器。
  # The university mark is a vector SVG, which Flutter cannot render natively, so this
  # pure-Dart renderer draws it.
  flutter_svg: ^2.0.10
  pocketbase: ^0.25.1
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.4
  path: ^1.9.1
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints 是官方推荐规则集。注意它只提供 lint，不做格式化。
  # The official recommended lint set; lints only, no formatting opinions.
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  # 由 flutter gen-l10n 生成 lib/l10n/app_localizations*.dart
  # generates lib/l10n/app_localizations*.dart via flutter gen-l10n
  generate: true
  # 高校归属标识（校徽）。资源路径由高校配置提供，通用组件只接收参数。
  # The university mark used as a provenance label. Its path comes from the university
  # config; the generic widget only receives it as a parameter.
  assets:
    - assets/brand/
