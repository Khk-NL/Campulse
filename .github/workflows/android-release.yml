name: Campulse Android release
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/ai-gateway/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: campulse-android-main
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install gateway runtime dependency
        run: npm ci --prefix apps/ai-gateway --omit=dev --no-audit --no-fund
      - name: Check gateway
        run: node --test apps/ai-gateway/test/*.test.mjs
      - name: Check mobile
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Check production endpoints
        run: node scripts/check-mobile-production-config.mjs
      - name: Restore stable preview signing key
        env:
          KEYSTORE: ${{ secrets.CAMPULSE_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing stable preview signing secret'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/campulse-preview.keystore"
          chmod 600 "$RUNNER_TEMP/campulse-preview.keystore"
          echo "CAMPULSE_PREVIEW_KEYSTORE_PATH=$RUNNER_TEMP/campulse-preview.keystore" >> "$GITHUB_ENV"
      - name: Build APK in GitHub
        working-directory: apps/mobile
        env:
          CAMPUS_WECHAT_APP_ID: ${{ secrets.CAMPUS_WECHAT_APP_ID }}
        run: |
          test -n "$CAMPUS_WECHAT_APP_ID" || { echo 'Missing WeChat mobile AppID configuration'; exit 1; }
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release --build-number=$((1000 + ${{ github.run_number }})) --dart-define-from-file=config/eduwork.production.example.json --dart-define=CAMPUS_WECHAT_APP_ID="$CAMPUS_WECHAT_APP_ID" --dart-define=CAMPUS_APP_VERSION="$VERSION"
      - name: Publish APK and source metadata to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs apps/mobile/build/app/outputs/flutter-apk/app-release.apk | grep 'SHA-256 digest: 199f2dcbfb81d9260fbf4f220b2d22dfcdcdbe752696b900583feaf12d7af494'
          mkdir -p release
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk release/Campulse-latest.apk
          sha256sum release/Campulse-latest.apk > release/Campulse-latest.apk.sha256
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' apps/mobile/pubspec.yaml)
          printf '{"sourceCommit":"%s","run":"%s","version":"%s","preview":true}\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$VERSION" > release/Campulse-latest.json
          gh release view campulse-preview >/dev/null 2>&1 || gh release create campulse-preview --prerelease --title 'Campulse Android 预览版' --notes 'GitHub Actions 自动构建。预览签名与早期安装包保持一致；邮件与微信能力受审核状态限制。'
          gh release upload campulse-preview release/Campulse-latest.apk release/Campulse-latest.apk.sha256 release/Campulse-latest.json --clobber
