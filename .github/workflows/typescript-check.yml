name: Campulse TypeScript checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai-gateway/**'
      - 'adapters/**'
      - 'packages/**'
      - 'scripts/smoke/**'
      - 'scripts/serve-web*'
      - 'scripts/admin-console.test.mjs'
      - 'scripts/ui-copy.test.mjs'
      - 'scripts/check-pb-migrations.mjs'
      - 'deploy/pocketbase/pb_migrations/**'
      - 'apps/mobile/lib/l10n/*.arb'
      - 'apps/mobile/lib/features/**'
      - 'deploy/pocketbase/pb_public/*.html'
      - 'deploy/pocketbase/pb_public/assets/admin*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/typescript-check.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/ai-gateway/**'
      - 'adapters/**'
      - 'packages/**'
      - 'scripts/smoke/**'
      - 'scripts/serve-web*'
      - 'scripts/admin-console.test.mjs'
      - 'scripts/ui-copy.test.mjs'
      - 'scripts/check-pb-migrations.mjs'
      - 'deploy/pocketbase/pb_migrations/**'
      - 'apps/mobile/lib/l10n/*.arb'
      - 'apps/mobile/lib/features/**'
      - 'deploy/pocketbase/pb_public/*.html'
      - 'deploy/pocketbase/pb_public/assets/admin*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/typescript-check.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@12.5.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/check-pb-migrations.mjs
